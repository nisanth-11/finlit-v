name: FinLitIndia
options:
  bundleIdPrefix: com.nish
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  FinLitIndia:
    type: application
    platform: iOS
    sources:
      - path: FinLitIndia
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: FinLit India
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nish.finlitindia
        PRODUCT_NAME: FinLit India
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MX2RLXX2W3
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  FinLitIndiaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FinLitIndiaUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nish.finlitindia.uitests
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MX2RLXX2W3
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: FinLitIndia
